<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<!-- Icons: Lucide 1.75.0 (ISC) - https://lucide.dev -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.backgroundColor = theme === 'dark' ? '#000' : '#fff';
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/github-markdown.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="layout">
  <aside class="all-pages" aria-label="All pages">
    <h2>Pages</h2>

    <input id="q" type="search" placeholder="Search" aria-label="Search files" autocomplete="off" spellcheck="false">

    <div id="pages">
      %LIST%
    </div>

    <p class="empty" id="empty" hidden>No matching files.</p>
  </aside>

  <main class="markdown-body" id="home">
    %CONTENT%
    <footer class="page-footer" aria-label="Page footer">
      <div class="footer-info">
        <p><strong>Last updated:</strong> <span class="last-updated">%LAST_UPDATED%</span></p>
        <p><strong>Author:</strong> %AUTHOR%</p>
        <p><strong>License:</strong> <a href="/LICENSE.html">LICENSE</a></p>
        <p><strong>Reading time:</strong> %READ_TIME%</p>
        <p><strong>Built:</strong> %BUILD_DATE%</p>
      </div>
    </footer>
  </main>
</div>

<button class="sidebar-toggle" type="button" aria-label="Toggle page list" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
</button>
<div class="sidebar-backdrop" hidden></div>
<div class="fabs">
  <a class="back disabled" href="index.html" aria-label="Home" title="You are home" aria-disabled="true">
    <svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </a>
  <button class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <a class="top" href="#top" aria-label="Back to top" title="Back to top">
    <svg class="ring" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <circle class="ring-track" cx="20" cy="20" r="17"></circle>
      <circle class="ring-bar" cx="20" cy="20" r="17"></circle>
    </svg>
    <svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>
  </a>
</div>

<script>
  (function () {
    var input = document.getElementById('q');
    var items = Array.prototype.slice.call(document.querySelectorAll('[data-file]'));
    var sections = Array.prototype.slice.call(document.querySelectorAll('[data-group]'));
    var empty = document.getElementById('empty');

    input.addEventListener('input', function () {
      var query = input.value.trim().toLowerCase();
      var shown = 0;
      for (var i = 0; i < items.length; i++) {
        var match = !query || items[i].getAttribute('data-search').indexOf(query) !== -1;
        items[i].hidden = !match;
        if (match) shown++;
      }
      for (var j = 0; j < sections.length; j++) {
        sections[j].hidden = !sections[j].querySelector('[data-file]:not([hidden])');
      }
      empty.hidden = shown !== 0;
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === '/' && document.activeElement !== input) {
        event.preventDefault();
        input.focus();
      }
    });

    var sidebar = document.querySelector('.all-pages');
    var scrollKey = 'sidebar-scroll';
    if (sidebar) {
      var savedScroll = sessionStorage.getItem(scrollKey);
      if (savedScroll !== null) sidebar.scrollTop = Number(savedScroll);
      sidebar.addEventListener('scroll', function () {
        sessionStorage.setItem(scrollKey, String(sidebar.scrollTop));
      });
    }

    var toggle = document.querySelector('.sidebar-toggle');
    var backdrop = document.querySelector('.sidebar-backdrop');
    function setSidebar(open) {
      document.body.classList.toggle('sidebar-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      backdrop.hidden = !open;
    }
    if (toggle) {
      toggle.addEventListener('click', function () {
        setSidebar(!document.body.classList.contains('sidebar-open'));
      });
      backdrop.addEventListener('click', function () { setSidebar(false); });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setSidebar(false);
      });
    }
  })();
</script>
<script src="assets/site.js" defer></script>
</body>
</html>
